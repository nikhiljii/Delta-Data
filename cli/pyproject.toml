[project]
name = "deltadata"
dynamic = ["version"]
description = "Command-line interface for DeltaData -- behavioral regression testing for SQL, designed for local dev and CI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "DeltaData" },
]
keywords = ["sql", "testing", "ci", "regression-testing", "data-quality", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/nikhiljii/Delta-Data"
Repository = "https://github.com/nikhiljii/Delta-Data"
Issues = "https://github.com/nikhiljii/Delta-Data/issues"
Changelog = "https://github.com/nikhiljii/Delta-Data/blob/main/cli/CHANGELOG.md"

[project.scripts]
deltadata = "deltadata_cli.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "deltadata_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["deltadata_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "deltadata_cli",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]
