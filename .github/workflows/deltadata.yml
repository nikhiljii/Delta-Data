name: DeltaData behavioral check

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  deltadata:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs this trusted base revision only. Never check
      # out or execute the PR head; SQL text is read as data by the helper.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # Need the full graph to compute GitHub's merge-base comparison.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Identify changed SQL files
        id: inspect
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          python .github/scripts/deltadata_pr.py inspect \
            --repository "$REPOSITORY" \
            --pull-number "$PR_NUMBER" \
            --changed-count "$PR_CHANGED_FILES" \
            --output "$GITHUB_OUTPUT"

      - name: Non-SQL pull request
        if: steps.inspect.outputs.has_sql == 'false'
        run: echo "No SQL files changed; DeltaData check passed."

      - name: Reject SQL changes from a fork
        if: steps.inspect.outputs.has_sql == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::SQL pull requests from forks are not analyzed with DeltaData credentials. Open the change from a trusted branch or run the analysis in a trusted environment."
          exit 1

      - name: Install released DeltaData CLI
        if: steps.inspect.outputs.has_sql == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: python -m pip install "deltadata==0.1.2"

      - name: Fetch PR SQL objects without checking out PR code
        if: steps.inspect.outputs.has_sql == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          fetched_head="$(git rev-parse "refs/remotes/pull/${PR_NUMBER}/head")"
          if [[ "$fetched_head" != "$PR_HEAD_SHA" ]]; then
            echo "::error::The PR head changed during this run; rerun the check against the updated commit."
            exit 1
          fi

      - name: Compare changed SQL using base-version CSV data
        if: steps.inspect.outputs.has_sql == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_SQL_B64: ${{ steps.inspect.outputs.changed_sql_b64 }}
          DELTADATA_API_URL: ${{ secrets.DELTADATA_API_URL }}
          DELTADATA_API_KEY: ${{ secrets.DELTADATA_API_KEY }}
        run: |
          python .github/scripts/deltadata_pr.py compare \
            --repository "$REPOSITORY" \
            --head-repository "$HEAD_REPOSITORY" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --changed-sql-b64 "$CHANGED_SQL_B64"
